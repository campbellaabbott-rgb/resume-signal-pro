    <script>
      /* THE FIRST SCRIPT ON EVERY PAGE, AND IT MUST STAY FIRST: inline, classic
         (no src, no module, no defer, no async), so it runs before the host's
         deferred analytics records the address and before the app, or the
         auth client (which reads the query as well as the fragment), reads it.
         It moves the credentials a URL can carry into this tab's
         sessionStorage (key rb_url_stash) and rewrites the address without
         them. Keys are compared decoded (URLSearchParams), in the query and
         the fragment alike. A sign-in's parts leave the address even when the
         stash cannot be written: that sign-in is lost, never adopted unasked.
         A /success address names ONE purchase or ONE analysis (S13-002): what
         it names replaces the purchase-and-analysis pair the stash held for
         /success in the same write, so a second purchase in this tab is never
         shown the first one's analysis, and a share is stored with the
         purchase it belongs to. Each path keeps its own session id
         ("session_id:" + path), so a payment return on one page never evicts
         another page's purchase that is paid and not yet delivered.
         src/lib/auth-fragment.ts reads them back; the keys are listed there,
         and src/test/r1-signin-stash.test.ts runs this script. */
      (function () {
        try {
          var L = location, P = L.pathname.replace(/\/+$/, "") || "/", K = "rb_url_stash";
          var T = "access_token refresh_token provider_token provider_refresh_token token_hash code".split(" ");
          var E = ["error", "error_code", "error_description"];
          var G = T.concat("expires_at", "expires_in", "token_type", "type", E), N = {}, S = {}, h = L.hash.slice(1), ok = 0, o, i, k, v, W;
          var q = new URLSearchParams(L.search), q2 = new URLSearchParams(L.search), f = null, f2 = null;
          var qh = 0, qs = 0, fh = 0, fs = 0, whole = /^\/(email\/unsubscribe|market-pulse\/confirm|fix-plan\/confirm)$/.test(P);
          var any = function (p, list) { for (var j = 0; j < list.length; j++) if (p.has(list[j])) return 1; return 0; };
          var cut = function (p, p2) { var c = 0; for (var j = 0; j < G.length; j++) { var w = p.get(G[j]); if (w !== null) { N[G[j]] = w; p["delete"](G[j]); p2["delete"](G[j]); c = 1; } } return c; };
          if (whole) { if (h) { S.fragment = "#" + h; S.fragment_path = P; fs = 1; } }
          else if (h) {
            f = new URLSearchParams(h); f2 = new URLSearchParams(h);
            if (any(f, T) || any(f, E)) fh = cut(f, f2);
            v = f.get("confirm"); if (P === "/data-api" && v !== null) { S.fragment = "#confirm=" + v; S.fragment_path = P; f["delete"]("confirm"); fs = 1; }
          }
          if (any(q, T) || any(q, ["error_code", "error_description"]) || (P === "/auth" && any(q, ["type", "error"]))) qh = cut(q, q2);
          v = q.get("session_id"); if (v !== null) { S.session_id = v; S.session_id_path = P; S["session_id:" + P] = v; q["delete"]("session_id"); qs = 1; }
          v = q.get("share"); if (P === "/success" && v !== null) { S.share = v; S.share_path = P; q["delete"]("share"); qs = 1; }
          if (!qh && !qs && !fh && !fs) return;
          try {
            W = window.sessionStorage;
            try { o = JSON.parse(W.getItem(K)); } catch (e) { o = null; }
            o = o && typeof o === "object" ? o : {};
            if (qh || fh) for (k = 0; k < G.length; k++) delete o[G[k]];
            if (P === "/success" && (S.session_id !== undefined || S.share !== undefined)) {
              delete o.share; delete o.share_path; delete o.share_session;
              if (S.session_id === undefined) { delete o["session_id:" + P]; if (o.session_id_path === P) { delete o.session_id; delete o.session_id_path; } }
              if (S.share !== undefined) S.share_session = S.session_id !== undefined ? S.session_id : "";
            }
            for (k in N) o[k] = N[k];
            for (k in S) o[k] = S[k];
            o._at = Date.now(); o._path = P;
            W.setItem(K, JSON.stringify(o));
            ok = 1;
          } catch (e) { ok = 0; }
          if (!ok) { q = q2; f = f2; qs = 0; fs = 0; if (!qh && !fh) return; }
          k = q.toString();
          i = whole ? (ok ? "" : h) : (fh || fs) && f ? f.toString() : h;
          history.replaceState(history.state, "", L.pathname + (qh || qs ? (k ? "?" + k : "") : L.search) + (i ? "#" + i : ""));
        } catch (e) { /* no URLSearchParams or no history: the address keeps its parts */ }
      })();
    </script>

    <!-- FONTS NEVER BLOCK THE FIRST PAINT, AND THEY ARE USED (SEO-020).
         The faces are declared here, in the first bytes of the page, with
         font-display optional, and the Inter latin file (one variable file
         for 400-700) is preloaded: no font stylesheet is requested at all.
         Text paints in the metric-matched Inter Fallback (src/index.css)
         unless Inter is ready inside the browser's short block period; a
         face that is not ready then is not swapped in later, so the
         prerendered page never re-wraps for it (the swap cost the Domino's
         company page 0.136 of its 0.155 CLS on a phone, 2026-10-24). On a
         first visit over a slow line that view stays in the fallback; from
         the next page load on the file comes from the HTTP cache and Inter
         renders. THE ROUND'S FIRST TRY applied Google's font CSS by a media
         swap after the first paint: an optional face declared after the
         first layout is never used, so Inter rendered on no load at all,
         first or repeat, while its file still downloaded (lab, 2026-10-24).
         These are the woff2 files Google's own CSS names for these faces
         (Inter v20, JetBrains Mono v24); self-hosting them in public/fonts
         would also drop the font host's connection. -->

    <!-- Structured Data - WebSite. Route-specific schema (WebApplication,
         FAQPage, HowTo, etc.) is injected per-page by React; the static head
         must stay generic because it ships on every route. The old static
         Product block carried an invented aggregateRating (fake review markup
         risks a Google manual action) and a site-wide FAQPage that conflicted
         with per-page FAQs — both removed deliberately; do not re-add. -->
    <!-- THE SITE'S ONLY WebSite ENTITY. The SearchAction lives here rather than
         in prerender-seo.mjs: the homepage briefly shipped two WebSite blocks
         with identical name+url, one with the searchbox and one without, which
         lets Google attribute the sitelinks searchbox to the block that does
         not declare it. One URL, one entity. Do not add a second. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Resume Booster",
      "url": "https://resumebooster.work",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://resumebooster.work/jobs?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
