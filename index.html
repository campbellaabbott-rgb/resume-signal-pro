<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c1222" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#0c1222" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Primary Meta Tags (sitewide defaults — per-route tags override via react-helmet-async) -->
    <meta name="google-site-verification" content="qcCdpa4oOQPq9nz_VcJwW-52UDnSLmUzDWj8Mh0N0Js" />
    <title>Resume Booster — Live Job Board: 600,000+ Verified Openings, Zero Ghost Jobs</title>
    <meta name="description" content="A live job board with zero ghost jobs: 600,000+ openings pulled straight from companies' own career systems, re-verified all day. Scan your resume free and see your match score on every posting.">
    <meta name="author" content="Resume Booster" />
    <meta name="keywords" content="resume review, resume feedback, ATS optimization, job search, career coaching, resume tips, interview preparation, CV optimization, job application help">
    <meta name="robots" content="index, follow" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://bwhdazbotpblihdxcmho.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://bwhdazbotpblihdxcmho.supabase.co" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://js.stripe.com" />

    <!-- Open Graph / Facebook (sitewide fallback for non-JS social crawlers) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://resumebooster.work/" />
    <meta property="og:title" content="Resume Booster — Live Job Board: 600,000+ Verified Openings, Zero Ghost Jobs" />
    <meta property="og:description" content="A live job board with zero ghost jobs: 600,000+ openings direct from company career systems, re-verified all day — plus a free resume fit scan." />
    <meta property="og:image" content="https://resumebooster.work/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Resume Booster - Get recruiter-grade resume feedback in 30 seconds" />
    <meta property="og:site_name" content="Resume Booster" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://resumebooster.work/" />
    <meta name="twitter:title" content="Resume Booster — Live Job Board: 600,000+ Verified Openings, Zero Ghost Jobs" />
    <meta name="twitter:description" content="A live job board with zero ghost jobs: 600,000+ openings direct from company career systems, re-verified all day — plus a free resume fit scan." />
    <meta name="twitter:image" content="https://resumebooster.work/og-image.png" />
    <meta name="twitter:image:alt" content="Resume Booster - AI-powered resume analysis" />

    <!-- Structured Data - WebSite. Route-specific schema (WebApplication,
         FAQPage, HowTo, etc.) is injected per-page by React; the static head
         must stay generic because it ships on every route. The old static
         Product block carried an invented aggregateRating (fake review markup
         risks a Google manual action) and a site-wide FAQPage that conflicted
         with per-page FAQs — both removed deliberately; do not re-add. -->
    <!-- THE SITE'S ONLY WebSite ENTITY. The SearchAction lives here rather than
         in prerender-seo.mjs: the homepage briefly shipped two WebSite blocks
         with identical name+url, one with the searchbox and one without, which
         lets Google attribute the sitelinks searchbox to the block that does
         not declare it. One URL, one entity. Do not add a second. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Resume Booster",
      "url": "https://resumebooster.work",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://resumebooster.work/jobs?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>

  <body>
    <!-- Skip to main content for accessibility -->
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2 focus:bg-primary focus:text-primary-foreground focus:rounded-md focus:outline-none">
      Skip to main content
    </a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
