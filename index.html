<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c1222" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#0c1222" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Primary Meta Tags (sitewide defaults — per-route tags override via react-helmet-async) -->
    <title>Resume Booster | Recruiter-Grade Resume Feedback</title>
    <meta name="description" content="AI-powered ATS resume optimization with recruiter-trained feedback. Keyword analysis, stronger bullets, and fixes in minutes.">
    <meta name="author" content="Resume Booster" />
    <meta name="keywords" content="resume review, resume feedback, ATS optimization, job search, career coaching, resume tips, interview preparation, CV optimization, job application help">
    <meta name="robots" content="index, follow" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://bwhdazbotpblihdxcmho.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://bwhdazbotpblihdxcmho.supabase.co" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://js.stripe.com" />

    <!-- Open Graph / Facebook (sitewide fallback for non-JS social crawlers) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://resumebooster.work/" />
    <meta property="og:title" content="Resume Booster | Recruiter-Grade Resume Feedback" />
    <meta property="og:description" content="AI-powered ATS resume optimization with recruiter-trained feedback. Keyword analysis, stronger bullets, and fixes in minutes." />
    <meta property="og:image" content="https://resumebooster.work/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Resume Booster - Get recruiter-grade resume feedback in 30 seconds" />
    <meta property="og:site_name" content="Resume Booster" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://resumebooster.work/" />
    <meta name="twitter:title" content="Resume Booster | Recruiter-Grade Resume Feedback" />
    <meta name="twitter:description" content="AI-powered ATS resume optimization with recruiter-trained feedback. Keyword analysis, stronger bullets, and fixes in minutes." />
    <meta name="twitter:image" content="https://resumebooster.work/og-image.png" />
    <meta name="twitter:image:alt" content="Resume Booster - AI-powered resume analysis" />

    <!-- Structured Data - Product -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Product",
      "name": "Resume Booster Analysis",
      "description": "AI-powered resume analysis with ATS-optimized bullet points, stronger action verbs, keyword suggestions, and red flag detection.",
      "image": "https://resumebooster.work/og-image.png",
      "brand": {
        "@type": "Brand",
        "name": "Resume Booster"
      },
      "offers": {
        "@type": "Offer",
        "price": "25.00",
        "priceCurrency": "USD",
        "availability": "https://schema.org/InStock",
        "priceValidUntil": "2026-12-31"
      },
      "category": "Career Services",
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "reviewCount": "150"
      }
    }
    </script>

    <!-- Structured Data - FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How does Resume Booster work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Upload your resume (PDF, DOCX, or paste text), complete a secure payment, and receive AI-powered feedback in under 30 seconds. The analysis includes ATS-optimized bullets, action verb improvements, keyword suggestions, and red flag detection."
          }
        },
        {
          "@type": "Question",
          "name": "What formats are supported?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Resume Booster accepts PDF, DOCX (Microsoft Word), and plain text files. You can also paste your resume content directly."
          }
        },
        {
          "@type": "Question",
          "name": "Is my resume data secure?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, your resume is processed securely and is not stored permanently. Payment is handled by Stripe, the industry leader in payment security."
          }
        }
      ]
    }
    </script>

    <!-- Structured Data - WebSite for Sitelinks -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Resume Booster",
      "url": "https://resumebooster.app",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://resumebooster.app/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <meta property="og:title" content="Resume Booster | Get Recruiter-Grade Resume Feedback in 30 Seconds">
  <meta name="twitter:title" content="Resume Booster | Get Recruiter-Grade Resume Feedback in 30 Seconds">
  <meta property="og:description" content="AI-powered ATS resume optimization with recruiter-trained feedback. Get keyword analysis, stronger bullet points, and actionable fixes in minutes.">
  <meta name="twitter:description" content="AI-powered ATS resume optimization with recruiter-trained feedback. Get keyword analysis, stronger bullet points, and actionable fixes in minutes.">
</head>

  <body>
    <!-- Skip to main content for accessibility -->
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2 focus:bg-primary focus:text-primary-foreground focus:rounded-md focus:outline-none">
      Skip to main content
    </a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
