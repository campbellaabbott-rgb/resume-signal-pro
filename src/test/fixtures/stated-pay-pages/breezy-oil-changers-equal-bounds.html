n the service provided</li><li>Recommend additional services</li><li>Answer questions</li><li>Accept payment for services.</li><li>Maintain a clean work area (including grounds, restrooms, customer area, etc.)</li><li>Perform related duties as assigned.</li></ul></li></ul>\n<p></p>\n<ul><li><strong>State Inspector</strong><ul><li>Ensure proper follow through on all directives, bulletins, schedules and reports from auction management and corporate sources</li><li>Maintain good operating condition of all equipment</li><li>Provide prompt and courteous service both in person and on the phone</li><li>Ensures thorough vehicle inspections by obtaining an accurate assessment of the vehicle in the form of detailed and well-written quality reports</li><li>Ensures vehicles meet acceptable standards by understanding, enforcing and facilitating the specific programs, rules and guidelines, as established by state guidelines</li><li>Other duties may apply assisting with yard responsibilities, declaring personal belongings left in vehicles by recording information, collecting and storing</li><li>Identifying damages, discrepancies, missing parts by inspecting vehicles as per inspection requirements</li><li>Complete thorough vehicle inspections by obtaining an accurate assessment of the vehicle, and ensure vehicles meet acceptable standards by understanding, enforcing, and facilitating the specific programs, rules and guidelines as established by customers</li><li>Responsible for site security by maintaining the auction perimeter</li><li>Must be able to endure long periods outdoors, therefore proper clothing is a requirement for this position</li></ul></li></ul>\n<p></p>\n<p><strong>Knowledge, Skills and Abilities:</strong></p>\n<p>To successfully perform the essential functions of the position, the employee must be able to read and write English and successfully complete the Lube Technician training course. Previous automotive experience is helpful but not required. Equipment operation includes overhead and floor mounted oil and grease guns, differential pump, transmission fluid exchange machine and calculator. The employee must be able to reach four feet in height overhead. Some bending, stretching, and walking up/down the stairs will be used constantly. The employee must be able to communicate effectively with customers and co-workers and respond to communication calls from co-workers. Mobility is required.</p>\n<p><strong>Scope of Position:</strong></p>\n<p>This position reports to the Manager and Assistant Manager and has no direct supervisory responsibilities. This position receives daily assignments from the Manager and Assistant Manager and will rotate through all Lube Technician duties (Upper Bay and Lower Bay, Greeter and Cashier).</p>\n<p><strong>Working Conditions:</strong></p>\n<p>This position works in a garage environment 100% of the time. Exposure to heavy equipment, slick surfaces, and hot-cold temperatures.</p>\n<p><strong>Major Accountabilities:</strong></p>\n<ul><li>Timeliness and quality of service provided.</li><li>Accurate and timely data input in computer.</li><li>Prompt and courteous customer service.</li><li>Clean and safe work area.</li><li>Safe work habits.</li><li>Clean and proper uniform usage, good hygiene.</li><li>Effective employee relations.</li></ul>","employmentType":"FULL_TIME","datePosted":"2026-07-06","hiringOrganization":{"@type":"Organization","name":"Oil Changers","logo":null,"sameAs":"https://oil-changers.breezy.hr"},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressCountry":"US","addressRegion":"TX","addressLocality":"AUSTIN"}},"baseSalary":{"@type":"MonetaryAmount","currency":"USD","value":{"@type":"QuantitativeValue","unitText":"HOUR","minValue":16,"maxValue":16}}}
