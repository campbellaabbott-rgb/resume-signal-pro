hile identifying opportunities for growth. Work with teachers to determine meaningful next steps and revisit areas of support to help ensure coaching translates into changes in classroom practice.</p><p>D) Remember! The Classroom is the 3rd Teacher: Support educators in creating thoughtful classroom environments that invite independence, exploration, collaboration, and learning. Help teachers intentionally select, organize, rotate, and enrich materials based on children's development, interests, and ongoing learning. Remember to provide thoughtful and positive feedback in a timely, professional, and caring manner.</p><p>Intentionally focus on family relationships through:</p><ul><li>Taking time to learn each child’s name as well as their guardians' name.</li><li>Taking time to learn and show genuine interest in our children and families.</li><li>Modeling warm, professional, and responsive communication with families.</li><li>Thoughtfully and positively provide feedback in a timely, professional, and caring manner while remembering that each child is the reason you are here and needed.</li></ul><p>Intentionally support continuous growth across the school through:</p><ul><li>Participating in monthly planning with school leadership and other Head Teachers to identify the most pressing classroom needs and coordinate support.</li><li>Sharing responsibility for classroom support based on current needs, individual strengths, and areas of expertise.</li><li>Partnering with teachers through observation, conversation, resources, modeling, and hands-on collaboration.</li><li>Following up throughout the month to recognize progress, adjust support, and help strengthen practice over time.</li><li>Participate in monthly Head Teacher Training conducted by the home office and help translate professional learning into classroom practice.</li></ul><p>The following outlines the secondary job responsibilities within the school:</p><ul><li>Assist the program director, and assistant director with completing onboarding for new staff members as necessary.</li><li>Assist the program director and assistant director in completing campus-wide inspections as necessary.</li><li>Assist in actively engaging staff members on the community page on Paylocity.</li><li>Assist in opening and closing the center, for example, 6 am-8 am / 5:30 pm-6:30 pm with the program director's guidance and by state and LSP policy and procedures.</li><li>Assist in answering school phones in a courteous, relatable, and professional manner.</li><li>Assist prospective families in scheduling admissions calls or tours.</li></ul><p>The foregoing description is for example only and is not exhaustive. Job responsibilities may evolve with the position. #INDFourpoints</p>","jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","streetAddress":"7710 N FM 620 Road","addressLocality":"Austin","addressRegion":"TX","postalCode":"78726","addressCountry":"US"}},"baseSalary":{"@type":"MonetaryAmount","currency":"USD","value":{"@type":"QuantitativeValue","minValue":18.00,"maxValue":22.00,"unitText":"HOUR"}}}
