<html><body><script>var x = {&quot;questions&quot;:[{&quot;text&quot;:&quot;Walk me through your last role where you were directly responsible for managing closers—how many were on your team, and what were your team’s monthly revenue numbers under your leadership?&quot;,&quot;required&quot;:true,&quot;type&quot;:{&quot;id&quot;:&quot;text&quot;,&quot;name&quot;:&quot;Text&quot;},&quot;_id&quot;:&quot;536aab15a0fe&quot;,&quot;questionnaire_id&quot;:&quot;90df652441e1&quot;},{&quot;text&quot;:&quot;What was your average close rate across your team, and what specific actions did you personally take to improve underperforming closers?&quot;,&quot;required&quot;:true,&quot;type&quot;:{&quot;id&quot;:&quot;text&quot;,&quot;name&quot;:&quot;Text&quot;},&quot;_id&quot;:&quot;b3f3ae32ed3a&quot;,&quot;questionnaire_id&quot;:&quot;90df652441e1&quot;},{&quot;text&quot;:&quot;Have you managed a warm-lead, appointment-driven sales model (not self-generated or cold outbound)? If yes, what was the lead flow like per day/week, and how was it generated?&quot;,&quot;required&quot;:true,&quot;type&quot;:{&quot;id&quot;:&quot;text&quot;,&quot;name&quot;:&quot;Text&quot;},&quot;_id&quot;:&quot;6a56b200d2fb&quot;,&quot;questionnaire_id&quot;:&quot;90df652441e1&quot;},{&quot;text&quot;:&quot;Not a requirement, just a bonus question: Do you speak Spanish? If so, what level would you describe your proficiency at, and have you used it in a sales or leadership setting?&quot;,&quot;required&quot;:true,&quot;type&quot;:{&quot;id&quot;:&quot;text&quot;,&quot;name&quot;:&quot;Text&quot;},&quot;_id&quot;:&quot;b1bb720c26e7&quot;,&quot;questionnaire_id&quot;:&quot;90df652441e1&quot;}]}]"><input type="hidden" id="questionnaireVersion" value="2"><div ng-repeat="section in questionnaire.sections" data-section="{{ section._id }}" ng-show="formSections.current == section._id || formSections.onlyOneSection" class="ng-hide questionnaire-section"><div ng-if="(section.title &amp;&amp; section.title.length &gt; 0) || (section.description &amp;&amp; section.description.length &gt; 0)" class="section-header-container"><h2 ng-if="section.title &amp;&amp; section.title.length &gt; 0"><span>{{ section.title }}</span></h2><div marked="section.description" ng-if="section.description &amp;&amp; section.description.length &gt; 0" class="section-body question-body"></div></div><div ng-if="section.questions" class="section questions"><ul><li ng-repeat="question in section.questions" ng-init="$questionIndex = $index" class="question"><div ng-if="question.type.id == &quot;text&quot; || !question.type"><h3><span>{{ question.text }}</span><span title="Required" ng-show="question.required" class="ng-hide required">*</span></h3><div marked="question.body" ng-if="question.body &amp;&amp; question.body.length &gt; 0" class="question-body"></div><input name="section_{{section._id}}_question_{{$index}}" ng-model="question.response" type="text" placeholder="" ng-required="{{question.required}}"><div ng-show="formSubmitted || sectionSubmitted" class="error-container ng-hide"><span ng-show="question.required &amp;&amp; !question.response" class="error polygot">%ERROR_INVALID_FORM_RESPONSE%</span></div></div><div ng-if="question.type.id == &quot;paragraph&quot;"><h3><span>{{ question.text }}</span><span title="Required" ng-show="question.required" class="ng-hide required">*</span></h3><div marked="question.body" ng-if="question.body &amp;&amp; question.body.length &gt; 0" class="question-body"></div><textarea name="section_{{section._id}}_question_{{$questionIndex}}" ng-model="question.response" placeholder="" ng-required="{{question.required}}" class="description full"></textarea><div ng-show="formSubmitted || sectionSubmitted" class="error-container ng-hide"><span ng-show="question.required &amp;&amp; !question.response" class="error polygot">%ERROR_INVALID_FORM_RESPONSE%</span></div></div><div ng-if="question.type.id == &quot;file&quot;"><h3><span>{{ question.text }}</span><span title="Required" ng-show="question.required" class="ng-hide required">*</span></h3><div marked="question.body" ng-if="question.body &amp;&amp; question.body.length &gt; 0" class="question-body"></div><input type="hidden" id="resume_required"</script></body></html>
