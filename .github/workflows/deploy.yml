# DEPLOY EDGE FUNCTIONS ON PUSH, AND PROVE IT LANDED.
#
# Every deploy in this project has gone through a human driving a Lovable
# session, and twice on 2026-08-07 that shipped STALE CODE while reporting
# success: the project copy had stopped pulling from GitHub, so origin/main was
# at BUILD_VERSION 2026-08-07.3 while the deployed function still answered
# 2026-08-07.1. Nothing surfaced it — it was caught by hand-diffing the
# deployed bundle against the repo.
#
# So this workflow does two jobs, and the SECOND is the one that pays for
# itself even if the first never runs:
#
#   deploy  — supabase functions deploy, on changes under supabase/functions/
#   verify  — read the live BUILD_VERSION back and FAIL if it does not match
#             the one in the repo at this commit
#
# The verify job runs on every push regardless of who deployed. If you deploy
# by hand through Lovable, this still tells you within a minute whether the
# thing you pushed is the thing that is now answering.
#
# MIGRATIONS ARE NOT AUTOMATIC, deliberately. `supabase db push` on every merge
# to main would apply schema changes to production with no human between the
# commit and the database. On 2026-08-07 a migration in this repo silently
# reverted a documented incident fix (a published median switched back to our
# discovery timestamp from the employer's stated date, an 17.6-day difference);
# the test suite caught it, but the "a person runs it and reads the error"
# step is a real gate and removing it is not an improvement. Migrations run
# from workflow_dispatch with an explicit confirm, so applying one is a choice
# somebody makes on purpose.
#
# SECRETS REQUIRED (repo settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   ONLY needed for the manual migration job
# The verify job needs no secret: it reads the public URL and publishable key
# from the committed .env (an earlier version of this note said SUPABASE_URL
# and SUPABASE_ANON_KEY were "already set"; neither ever was).
#
# If SUPABASE_ACCESS_TOKEN is absent the deploy job skips with a notice rather
# than failing the run — an unconfigured pipeline should be visibly idle, not
# a red X on every commit that teaches everyone to ignore red Xs.
#
# A NOTE ON TWO WRITERS. Lovable also deploys this project from its own copy.
# Both writing to the same functions is safe in the sense that the last write
# wins and both come from the same git history — but if a deploy here and a
# Lovable session overlap, the verify job below is what tells you which one
# won. That is the reason it reports the version rather than just exiting 0.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: 'Type "apply" to run pending database migrations (leave blank to skip)'
        required: false
        default: ''

concurrency:
  # One deploy at a time. Two overlapping runs would race to write the same
  # functions and the verify step could then check a version neither produced.
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check for deploy credentials
        id: creds
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice title=Deploy skipped::SUPABASE_ACCESS_TOKEN is not set — functions were not deployed. The verify job still runs and will report whether the live version matches this commit."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.creds.outputs.ready == 'true'
        with:
          version: latest

      - name: Deploy edge functions
        if: steps.creds.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # ALL functions, never one. On 2026-08-03 a single-function deploy was
        # followed within minutes by 79 of 80 functions returning
        # NOT_FOUND_FUNCTION_BLOB — an eight-minute outage across the board,
        # every checkout path and the scanner. The mechanism was never proven,
        # so this is a strong correlation rather than a law, but the operational
        # rule stands: deploy the whole set.
        run: supabase functions deploy --project-ref bwhdazbotpblihdxcmho

  verify:
    # Runs even when the deploy job skipped or failed: the question "is the
    # live code the code I pushed" is worth answering either way.
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Wait for propagation
        run: sleep 45

      # THE URL AND KEY COME FROM THE COMMITTED .env, as board-health and the
      # bot-wall sweep read them. They were read from repo secrets that were
      # never set, so from the day this job was written it printed a warning
      # and exited 0 on every push: a green "verify" that had compared nothing.
      # A run that cannot compare now FAILS, because "not verified" is not "OK".
      #
      # RED UNTIL THE DEPLOY LANDS, BY DESIGN. Lovable deploys after the merge,
      # so on a push that bumps job-board's BUILD_VERSION this job reads the
      # previous build and fails, truthfully: production is not this commit
      # yet. Re-run the job once the Lovable deploy is done; green then means
      # production serves this build or a later one.
      - name: Compare the live BUILD_VERSION against this commit
        run: |
          set -u
          SB_URL=$(grep -m1 '^VITE_SUPABASE_URL=' .env 2>/dev/null | cut -d= -f2- | tr -d '"' || true)
          SB_ANON=$(grep -m1 '^VITE_SUPABASE_PUBLISHABLE_KEY=' .env 2>/dev/null | cut -d= -f2- | tr -d '"' || true)
          if [ -z "$SB_URL" ] || [ -z "$SB_ANON" ]; then
            echo "::error title=Deploy not verified::could not read VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY from .env, so nothing was compared."
            exit 1
          fi

          EXPECTED=$(grep -m1 -oE 'BUILD_VERSION = "[^"]+"' supabase/functions/job-board/index.ts | sed 's/.*"\(.*\)"/\1/' || true)
          if [ -z "$EXPECTED" ]; then
            echo "::error title=Deploy not verified::no BUILD_VERSION in supabase/functions/job-board/index.ts"
            exit 1
          fi
          echo "repo expects: $EXPECTED"

          LIVE=$(curl -sS -X POST "$SB_URL/functions/v1/job-board" \
            -H "apikey: $SB_ANON" -H "Authorization: Bearer $SB_ANON" \
            -H "Content-Type: application/json" -H "x-rb-budget: probe" -d '{"action":"status"}' --max-time 60 \
            | jq -r '.version // empty' 2>/dev/null || true)
          echo "live reports: ${LIVE:-nothing}"
          if [ -z "$LIVE" ]; then
            echo "::error title=Deploy not verified::job-board's status answered no version (down, not JSON, or the field moved), so nothing was compared."
            exit 1
          fi

          # THIS BUILD OR A LATER ONE: YYYY-MM-DD.N, the date first, then N as a number.
          ld="${LIVE%%.*}"; ln="${LIVE#*.}"; ed="${EXPECTED%%.*}"; en="${EXPECTED#*.}"
          ok=no
          if [ "$ld" \> "$ed" ]; then ok=yes
          elif [ "$ld" = "$ed" ]; then
            case "$ln$en" in *[!0-9]*) [ "$ln" = "$en" ] && ok=yes;; *) [ "$ln" -ge "$en" ] && ok=yes;; esac
          fi
          if [ "$ok" != yes ]; then
            echo "::error title=Deployed code is not this commit::job-board serves '$LIVE' and this commit is '$EXPECTED'. Either the Lovable deploy has not run yet (re-run this job after it does) or it shipped stale code, which happened twice on 2026-08-07."
            exit 1
          fi
          echo "::notice title=Deploy verified::job-board serves $LIVE (this commit is $EXPECTED)"

  migrate:
    # MANUAL ONLY. See the header: a migration that applies itself removes the
    # step where a human reads the error.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.apply_migrations == 'apply'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --project-ref bwhdazbotpblihdxcmho
