# DEPLOY EDGE FUNCTIONS ON PUSH, AND PROVE IT LANDED.
#
# Every deploy in this project has gone through a human driving a Lovable
# session, and twice on 2026-08-07 that shipped STALE CODE while reporting
# success: the project copy had stopped pulling from GitHub, so origin/main was
# at BUILD_VERSION 2026-08-07.3 while the deployed function still answered
# 2026-08-07.1. Nothing surfaced it — it was caught by hand-diffing the
# deployed bundle against the repo.
#
# So this workflow does two jobs, and the SECOND is the one that pays for
# itself even if the first never runs:
#
#   deploy  — supabase functions deploy, on changes under supabase/functions/
#   verify  — read back the live build of EVERY function this push changed
#             (its own folder, or a _shared module it imports) and FAIL if
#             one serves an older build than this commit carries
#
# The verify job runs on every push regardless of who deployed. If you deploy
# by hand through Lovable, this still tells you within a minute whether the
# thing you pushed is the thing that is now answering. Until S14X-139 it
# compared job-board's BUILD_VERSION alone, so a push that changed another
# function went green on job-board's build, and one that changed no function
# went red whenever job-board lagged main.
#
# MIGRATIONS ARE NEVER APPLIED FROM HERE (S14X-246). A manual job used to run
# `supabase db push` against production with the CLI at its latest version:
# a push applies every file the database has not recorded, so it ignores the
# ledger's neverApply, hold and order rules (docs/deploy-ledger.json), and a
# dispatch could apply a file decided never to apply, or one held until a
# deploy verified. Migrations reach production only through the Lovable
# message the ledger prints (node scripts/deploy-ledger.mjs --message) and the
# owner's own steps in the SQL editor, each a choice somebody makes on purpose.
#
# SECRETS (repo settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  personal access token from supabase.com/dashboard/account/tokens
# The verify job needs no secret: OPTIONS preflights carry no key, and the
# project URL is the ledger's (docs/deploy-ledger.json supabaseUrl).
#
# If SUPABASE_ACCESS_TOKEN is absent the deploy job skips with a notice rather
# than failing the run — an unconfigured pipeline should be visibly idle, not
# a red X on every commit that teaches everyone to ignore red Xs.
#
# A NOTE ON TWO WRITERS. Lovable also deploys this project from its own copy.
# Both writing to the same functions is safe in the sense that the last write
# wins and both come from the same git history — but if a deploy here and a
# Lovable session overlap, the verify job below is what tells you which one
# won. That is the reason it reports the versions rather than just exiting 0.
name: Deploy

on:
  push:
    branches: [main]
  # By hand: re-run the comparison for the latest commit on main (the commits
  # since its first parent).
  workflow_dispatch:

concurrency:
  # One deploy at a time. Two overlapping runs would race to write the same
  # functions and the verify step could then check a version neither produced.
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check for deploy credentials
        id: creds
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice title=Deploy skipped::SUPABASE_ACCESS_TOKEN is not set — functions were not deployed. The verify job still runs and will report whether the live version matches this commit."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.creds.outputs.ready == 'true'
        with:
          version: latest

      - name: Deploy edge functions
        if: steps.creds.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # ALL functions, never one. On 2026-08-03 a single-function deploy was
        # followed within minutes by 79 of 80 functions returning
        # NOT_FOUND_FUNCTION_BLOB — an eight-minute outage across the board,
        # every checkout path and the scanner. The mechanism was never proven,
        # so this is a strong correlation rather than a law, but the operational
        # rule stands: deploy the whole set.
        run: supabase functions deploy --project-ref bwhdazbotpblihdxcmho

  verify:
    # Runs even when the deploy job skipped or failed: the question "is the
    # live code the code I pushed" is worth answering either way.
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # This commit and its parents; the commit main pointed at before the
          # push is fetched below when it is further back.
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wait for propagation
        run: sleep 45

      # EVERY FUNCTION THIS PUSH CHANGED, NOT JOB-BOARD ALONE (S14X-139). The
      # ledger lists the functions whose files the push changed (a _shared
      # module counts for every function importing it), reads the build each
      # one's OPTIONS preflight answers, and requires this commit's build or a
      # later one: the rule section 49 and the deploy message use. A function
      # that does not answer, or names no build, is "not verified", and that
      # is not "OK", so the run fails. RED WHILE PRODUCTION LAGS THIS PUSH, BY
      # DESIGN: deploy through Lovable, then re-run this job.
      - name: Compare the live build of every function this push changed against this commit
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -u
          FROM=""
          if [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git cat-file -e "$BEFORE^{commit}" 2>/dev/null || git fetch --quiet --no-tags --depth=1 origin "$BEFORE" || true
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then FROM="$BEFORE"; fi
          fi
          if [ -z "$FROM" ]; then FROM=$(git rev-parse --verify --quiet 'HEAD^1' || true); fi
          if [ -z "$FROM" ]; then
            echo "::error title=Deploy not verified::neither the commit before this push nor this commit's parent could be read, so nothing was compared."
            exit 1
          fi
          node scripts/deploy-ledger.mjs --push-verdict "$FROM"
