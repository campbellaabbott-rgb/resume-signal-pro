# IS ANY CLOSED VENDOR STILL CLOSED?
#
# The apply agent reaches 5.4% of the board. Everything past that ceiling is
# shut by a choice some vendor made, and choices change — RECON records
# Workable as "otherwise the cleanest vendor seen... if Turnstile ever comes
# off, this is a two-hour adapter." Nothing re-checked that, so a vendor could
# drop its wall and this project would find out never.
#
# Weekly, because a bot-wall policy changes on the order of months and a daily
# run would be six extra browser launches a week to learn the same thing. The
# expected result is "everything still walled", and the run stays GREEN when
# that is true: a red run every week for the expected state is the muted alert
# this project already has a rule against. The finding — a vendor going clean —
# is a ::warning:: annotation on the run instead.
#
# ROLLING SINCE 2026-09-06. The weekly schedule was already here; what was
# missing was that every run measured roughly the SAME tenants, so a year of
# runs produced one dated snapshot instead of a series. Each run now walks the
# next slice of an ordered employer universe (see worker/src/botwall-sweep.ts),
# and a full pass takes a couple of months — after which the second visit to an
# employer is what turns "walled on 2026-08-07" into "added a wall in October".
#
# The politeness knobs are untouched: three concurrent pages, one load each,
# the same navigation timeout and the same waits. What changed is WHICH pages,
# and the run's own wall-clock deadline, which is why the job timeout is longer
# than it was — the sweep stops itself first and reports a partial slice.
#
# It solves nothing, submits nothing and spoofs nothing. It loads a public
# posting's apply page and records what the page itself asks for.
name: Bot-wall sweep

on:
  schedule:
    # Mondays 06:12 UTC. Odd minute on purpose: the round slots are where every
    # other scheduled job in this account already piles up.
    - cron: "12 6 * * 1"
  workflow_dispatch:
    inputs:
      vendors:
        description: "Comma-separated vendors (default: the closed set)"
        required: false
        default: ""
      tenants:
        description: "Apply pages to load this run (default 240 — the 2026-08-07 sweep's own size)"
        required: false
        default: ""

jobs:
  sweep:
    runs-on: ubuntu-latest
    # The sweep's own deadline (SWEEP_DEADLINE_MIN, 20 by default) is what ends
    # the probing phase; this bound only has to sit clear of it plus the deps
    # and browser install, so the runner never kills a run mid-write.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install worker deps
        working-directory: worker
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        working-directory: worker
        run: npx playwright install --with-deps chromium

      # THE BOARD'S PUBLIC URL AND KEY COME FROM THE COMMITTED .env, as
      # board-health reads them. They were read from repo secrets that were
      # never set (the only secret is APPLY_WORKER_SECRET), so every scheduled
      # run before the lockfile broke exited 2 on "SUPABASE_URL / SUPABASE_ANON_KEY
      # not set". They are the pair the browser bundle ships to every visitor:
      # nothing secret, and a missing .env line fails loudly here rather than
      # reading as a sweep. The broker URL is the same project's function, so
      # it is derived rather than configured.
      - name: Read the board's public URL and key from .env
        run: |
          set -u
          URL=$(grep -m1 '^VITE_SUPABASE_URL=' .env 2>/dev/null | cut -d= -f2- | tr -d '"' || true)
          KEY=$(grep -m1 '^VITE_SUPABASE_PUBLISHABLE_KEY=' .env 2>/dev/null | cut -d= -f2- | tr -d '"' || true)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error title=Bot-wall sweep misconfigured::could not read VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY from .env"
            exit 1
          fi
          {
            echo "SUPABASE_URL=$URL"
            echo "SUPABASE_ANON_KEY=$KEY"
            echo "APPLY_BROKER_URL=${URL%/}/functions/v1/apply-broker"
          } >> "$GITHUB_ENV"

      - name: Sweep
        working-directory: worker
        env:
          # SUPABASE_URL, SUPABASE_ANON_KEY and APPLY_BROKER_URL arrive from the
          # step above (GITHUB_ENV); naming them here as well would override
          # them. Wall-observation persistence goes through the broker's
          # authenticated `wall` action (the worker deliberately holds no
          # service key); without APPLY_WORKER_SECRET the sweep prints a
          # labelled DRY RUN line and persists nothing -- measurement still
          # happens, the write is what's gated.
          APPLY_WORKER_SECRET: ${{ secrets.APPLY_WORKER_SECRET }}
        # The script exits 2 when those are missing rather than reporting a
        # sweep that measured nothing — an empty result must not read as clean.
        run: npx tsx src/botwall-sweep.ts "${{ github.event.inputs.vendors }}" "${{ github.event.inputs.tenants }}"
