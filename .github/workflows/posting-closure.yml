# THE DAILY CLOSED-BUT-BAKED CHECK (SEO/GEO audit 2026-11-07, B01; owner
# decision 2026-11-07, option A). Cloned from board-health.yml.
#
# The owner kept JobPosting markup on the posting pages on two conditions: a
# daily check of how many live posting pages are for postings their employer
# has already closed, and a STOP rule. This is the check. It runs
# scripts/posting-closure-check.mjs, which reads the live sitemap and ledger
# and asks each posting's employer system about it with GET requests only.
#
# THE RULE: "twice" is two consecutive daily checks whose closed share is over
# 5% (counting only postings with a definite employer answer; a run with more
# than 20% unknown answers is not judged). When it fires (exit 3) this opens
# or comments on a `posting-closure` issue and fails the run: the remedy is to
# set JOB_POSTING_MARKUP to false in src/config/seo-switches.ts and publish.
# A run that cannot judge (exit 4) or cannot read the site (exit 2) does the
# same, so a silent check is never mistaken for a clean one.
#
# ONE RUN PER UTC DATE, THREE SLOTS A DAY. GitHub drops most scheduled runs
# (board-health gets about 5 of its 48 slots), so the cron asks three times a
# day at off-peak minutes; the first run of a date measures, and a later slot
# the same date re-reads that verdict instead of measuring again (unless the
# first was not judged). The history of daily records survives between runs
# in the Actions cache (a new key per run, restored by prefix), and each run's
# record is uploaded as an artifact.
#
# THE OUTSIDE CHECK: when the repository secret POSTING_CLOSURE_PING_URL holds
# a healthchecks.io URL, every run pings it (/fail when the rule fired or the
# check could not judge), so a schedule GitHub stopped running is noticed.
#
# Nothing here writes to any employer or to the site: every request is a GET.
#
# THE PROPOSAL (SEO audit 2026-11-18, STRUCTURED-B1 part 2 and B2; owner yes,
# 2026-11-19). The pages a measuring run finds closed at their employer, and
# what each employer stated about the others (end dates, time types, whether
# it still serves the posting), are committed to ONE standing branch,
# posting-closure/next-publish, rebuilt on main each run, and ONE pull request
# from it is opened or updated. That is the only write this workflow makes to
# the repository: never to main, never to the site. A person merges, and the
# next bake retires the closed pages and applies the statements.
#
# WHEN GITHUB WILL NOT OPEN THE PULL REQUEST (review of 2026-11-21). This
# repository's "Allow GitHub Actions to create and approve pull requests" is
# off (default_workflow_permissions "read", can_approve_pull_request_reviews
# false), and that refuses the workflow's token a new pull request whatever
# the permissions below say. Turning it on is a repository-wide owner
# decision, since it also lets workflows approve pull requests. Until then the
# refusal is SAID, never failed: the branch is still committed, and the run
# summary, a warning and the standing posting-closure-closed issue give the
# link a person opens the pull request from. The run keeps failing only for
# the check's own verdict.
name: posting-closure
on:
  schedule:
    - cron: "41 2,10,18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: posting-closure
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The daily records so far: the newest cache this check saved.
      - name: Restore the daily records
        uses: actions/cache/restore@v4
        with:
          path: .posting-closure
          key: posting-closure-history-${{ github.run_id }}
          restore-keys: |
            posting-closure-history-

      - name: Measure the closed share and apply the rule
        id: check
        run: |
          set -u
          mkdir -p .posting-closure
          set +e
          node scripts/posting-closure-check.mjs --history .posting-closure/history.json --out .posting-closure/latest.json --closed-out .posting-closure/closed-today.txt --stated-out .posting-closure/employer-stated.txt
          CODE=$?
          set -e
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          case "$CODE" in
            0) echo "failed=" >> "$GITHUB_OUTPUT";;
            3) echo "failed=fired" >> "$GITHUB_OUTPUT"; echo "note=the STOP rule fired: two consecutive daily checks over 5% closed at the employer. Set JOB_POSTING_MARKUP to false in src/config/seo-switches.ts and publish." >> "$GITHUB_OUTPUT";;
            4) echo "failed=unjudged" >> "$GITHUB_OUTPUT"; echo "note=the check could not judge today (more than 20% of employer answers unknown, or nothing to check)" >> "$GITHUB_OUTPUT";;
            *) echo "failed=unreadable" >> "$GITHUB_OUTPUT"; echo "note=the check could not read the live sitemap or ledger (exit $CODE)" >> "$GITHUB_OUTPUT";;
          esac

      - name: Keep the daily records
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .posting-closure
          key: posting-closure-history-${{ github.run_id }}

      - name: Upload this run's record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: posting-closure-${{ github.run_id }}
          path: .posting-closure/
          if-no-files-found: warn
          retention-days: 90

      - name: Tell the outside check this run happened
        if: always()
        env:
          PING_URL: ${{ secrets.POSTING_CLOSURE_PING_URL }}
          FAILED: ${{ steps.check.outputs.failed }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        run: |
          set -u
          case "${PING_URL:-}" in
            https://*) ;;
            *) echo "::notice title=Posting closure::POSTING_CLOSURE_PING_URL is not set, so nothing outside GitHub notices when this schedule is skipped"; exit 0;;
          esac
          URL="${PING_URL%/}"
          if [ -n "${FAILED:-}" ] || [ "${CHECK_OUTCOME:-}" != "success" ]; then URL="$URL/fail"; fi
          curl -fsS -m 10 --retry 2 -o /dev/null "$URL" || echo "::warning title=Posting closure::the outside check did not answer"

      - name: Raise or update the alarm
        if: steps.check.outputs.failed != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NOTE: ${{ steps.check.outputs.note }}
        run: |
          set -u
          gh label create posting-closure --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "Opened by the daily posting-closure check" --force >/dev/null 2>&1 || true
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --label posting-closure --state open --json number --jq '.[0].number' || echo "")
          STAMP="$(date -u +'%Y-%m-%d %H:%M UTC')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$STAMP — $NOTE"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Posting closure: the daily check needs attention" \
              --label posting-closure \
              --body "$STAMP — $NOTE

          This issue was opened by .github/workflows/posting-closure.yml, which asks each live posting page's employer system (GET only) whether it still serves the posting. The record of each run is an artifact of that run. Close this once it is dealt with; the check comments here instead of opening duplicates while it stays open."
          fi

      # THE PAGES CLOSED AT THEIR EMPLOYER, FOR THE NEXT PUBLISH (SEO audit
      # 2026-11-18, CRAWL-M2). Nothing here writes to the site: today's closed
      # pages go into ONE standing issue as lines for
      # scripts/seo-seed/closed-at-employer.txt, which a publish commits and
      # the bake reads. Only a run that measured today writes them, so a later
      # slot re-reading the same date adds nothing.
      - name: Name the pages closed at their employer
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          FILE=.posting-closure/closed-today.txt
          if [ ! -s "$FILE" ]; then echo "no page closed at its employer in a run that measured today"; exit 0; fi
          N=$(grep -c . "$FILE" || true)
          gh label create posting-closure-closed --repo "$GITHUB_REPOSITORY" --color FBCA04 \
            --description "Pages the daily posting-closure check found closed at their employer" --force >/dev/null 2>&1 || true
          BODY="$(date -u +'%Y-%m-%d %H:%M UTC') — $N live posting page(s) closed at their employer. Add these lines to scripts/seo-seed/closed-at-employer.txt at the next publish; the bake retires each one (lines over 14 days old are ignored):

          \`\`\`
          $(cat "$FILE")
          \`\`\`"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --label posting-closure-closed --state open --json number --jq '.[0].number' || echo "")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Posting closure: pages closed at their employer, for the next publish" \
              --label posting-closure-closed \
              --body "$BODY

          Opened by .github/workflows/posting-closure.yml. Each daily run that finds a live page closed at its employer comments here instead of opening another issue."
          fi

      # THE PULL REQUEST (STRUCTURED-B1 part 2, B2). Only a run that measured
      # today has anything to propose: a later slot re-reading the same date
      # writes neither file. The branch is rebuilt on main each time, carrying
      # the closed lines of the proposal a person has not merged yet. A
      # refusal to send the branch or to open or update the pull request is
      # told (`tell`: a warning, the run summary and the standing issue) and
      # the step still succeeds: the check's verdict alone fails the run.
      - name: Propose the closed pages and the employers' statements as a pull request
        if: always() && steps.check.outputs.code != '2'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_LABEL: run ${{ github.run_id }}
        run: |
          set -u
          BRANCH=posting-closure/next-publish
          CLOSED=.posting-closure/closed-today.txt
          STATED=.posting-closure/employer-stated.txt
          COMPARE="https://github.com/$GITHUB_REPOSITORY/compare/main...$BRANCH?expand=1"
          tell() {
            MSG="$1"
            echo "::warning title=Posting closure proposal::$MSG"
            printf '### Posting closure proposal\n\n%s\n\n' "$MSG" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            ISSUE=$(gh issue list --repo "$GITHUB_REPOSITORY" --label posting-closure-closed --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
            if [ -n "$ISSUE" ]; then
              gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$(date -u +'%Y-%m-%d %H:%M UTC') — $MSG" >/dev/null 2>&1 \
                || echo "::warning title=Posting closure proposal::the standing issue #$ISSUE could not be told either"
            else
              gh label create posting-closure-closed --repo "$GITHUB_REPOSITORY" --color FBCA04 \
                --description "Pages the daily posting-closure check found closed at their employer" --force >/dev/null 2>&1 || true
              gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "Posting closure: pages closed at their employer, for the next publish" \
                --label posting-closure-closed \
                --body "$(date -u +'%Y-%m-%d %H:%M UTC') — $MSG

          Opened by .github/workflows/posting-closure.yml. Each daily run that finds a live page closed at its employer, or cannot open its proposal as a pull request, comments here instead of opening another issue." >/dev/null 2>&1 \
                || echo "::warning title=Posting closure proposal::no standing issue could be opened either"
            fi
          }
          if [ ! -s "$CLOSED" ] && [ ! -s "$STATED" ]; then echo "nothing measured this run, so nothing to propose"; exit 0; fi
          git fetch --no-tags origin main
          EARLIER=.posting-closure/earlier-closed.txt
          : > "$EARLIER"
          if git fetch --no-tags origin "$BRANCH" 2>/dev/null; then
            git show "origin/$BRANCH:scripts/seo-seed/closed-at-employer.txt" > "$EARLIER" 2>/dev/null || : > "$EARLIER"
          fi
          git checkout -B "$BRANCH" origin/main
          node scripts/posting-closure-check.mjs --propose --closed-today "$CLOSED" --stated-today "$STATED" --earlier-closed "$EARLIER" --run-label "$RUN_LABEL"
          if git diff --quiet -- scripts/seo-seed/closed-at-employer.txt scripts/seo-seed/employer-stated.txt; then echo "the proposal matches main"; exit 0; fi
          git add scripts/seo-seed/closed-at-employer.txt scripts/seo-seed/employer-stated.txt
          git -c user.name="posting-closure check" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "The daily closure check proposes its closed pages and what each employer stated ($RUN_LABEL)"
          if ! git push -q --force origin "HEAD:refs/heads/$BRANCH"; then
            tell "This run's proposal ($RUN_LABEL) could not be sent to branch $BRANCH, so it reaches no pull request; the lines are in this run's artifact (.posting-closure/closed-today.txt and employer-stated.txt)."
            exit 0
          fi
          BODY="Opened by .github/workflows/posting-closure.yml ($RUN_LABEL). It appends the pages the daily check found closed at their employer to scripts/seo-seed/closed-at-employer.txt and rewrites scripts/seo-seed/employer-stated.txt from the newest measuring run. Nothing reaches the site until this is merged and published: the next bake then retires each closed page and applies each employer's stated end date and time type."
          EXISTING=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            gh pr comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$(date -u +'%Y-%m-%d %H:%M UTC') — updated from $RUN_LABEL." \
              || tell "Branch $BRANCH carries this run's proposal ($RUN_LABEL), but pull request #$EXISTING could not be told."
          elif ! OUT=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
              --title "Posting closure: retire the pages closed at their employer and carry what each employer stated" \
              --body "$BODY" 2>&1); then
            WHY=$(printf '%s' "$OUT" | tr '\r\n' '  ' | cut -c1-300)
            tell "GitHub refused to open the pull request for this run's proposal ($RUN_LABEL: $WHY). The proposal is committed on branch $BRANCH: open the pull request by hand at $COMPARE and merge it before the next publish. Workflows here may not open pull requests while the repository setting 'Allow GitHub Actions to create and approve pull requests' is off; turning it on is the owner's decision, as it also lets workflows approve them."
          else
            echo "$OUT"
          fi

      - name: Fail the run while the check needs attention
        if: steps.check.outputs.failed != ''
        env:
          NOTE: ${{ steps.check.outputs.note }}
        run: |
          echo "::error title=Posting closure::$NOTE"
          exit 1
