# CI: every push and pull request runs the type, test, build and harness checks.
#
# WHAT THIS IS AND IS NOT. It is a record of whether a commit passes; it is a
# GATE only once main's branch protection requires the `test` and `deno-tests`
# jobs, which is the owner's setting and not this file's. Until 2026-10-10 the
# header said a regression "physically cannot reach main unnoticed" while main
# had no protection and 15 of its last 20 runs were red, 14 of them on flaky
# tests; PRs merged with their own CI red or unfinished.
#
# EVERY CHECK RUNS EVERY TIME. A failing step used to skip every step after it,
# so a red test step meant the production build and the apply-driver harness
# never ran on most of main's commits. Each check below runs when the installs
# it needs succeeded, whatever an earlier check said (`!cancelled()`).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # --legacy-peer-deps, and the reason is not laziness.
      #
      # This repo is installed with BUN — bun.lock and bun.lockb are what
      # Lovable builds from — and package-lock.json is a vestigial artifact.
      # `npm ci` has therefore never once succeeded here, which is why CI
      # failing on it on its very first run was a fact about the repo and not
      # about this workflow.
      #
      # The conflicts are peer METADATA that predates React 19, not real
      # breakage: next-themes@0.3.0 declares ^16.8||^17||^18, react-day-picker
      # @8.10.1 the same, and there is a chain of shadcn packages behind them.
      # The app demonstrably runs on React 19 with these exact versions — 2,028
      # tests and a production build pass against them.
      #
      # Chasing the versions instead was tried and rejected: next-themes fixes
      # cleanly at ^0.4.6, but react-day-picker only clears at v9, which is a
      # breaking API change requiring src/components/ui/calendar.tsx to be
      # rewritten. That is a real regression risk to take for an install flag.
      #
      # Worth revisiting when those peers catch up, or if this repo ever moves
      # to installing with npm for real. The worker package needs no flag — it
      # resolves clean on its own.
      - name: Install deps
        id: deps
        run: npm ci --legacy-peer-deps
      # BEFORE THE TYPECHECK, and the order is load-bearing.
      #
      # tsconfig.app.json includes `src`, and five tests there import worker
      # sources on purpose — sendable-mirror, broker-contract, harness-gate and
      # friends exist precisely to compare the app against the worker. tsc
      # follows those imports into worker/src/vendors/*.ts, which import
      # `playwright`, and playwright is a WORKER dependency.
      #
      # So the root typecheck cannot pass until the worker's deps exist. It
      # passes locally only because worker/node_modules is already there —
      # reproduced by moving that directory aside, which yields the identical
      # four TS2307 errors CI reported.
      #
      # Installing here rather than excluding worker/ from the typecheck: the
      # exclusion would silence the cross-boundary imports those mirror tests
      # depend on, which is the drift they were written to catch.
      #
      # STRICT, with no `|| npm install` behind it. That fallback hid a lockfile
      # drift for six weeks: Lovable moved @types/node to ^26 in package.json and
      # not in package-lock.json, so `npm ci` refused, `npm install` papered over
      # it here, and the bot-wall sweep -- which has no fallback -- failed every
      # Monday. src/test/the-worker-lockfile-is-one-npm-ci-accepts.test.ts runs
      # the same check locally.
      - name: Install worker deps
        id: worker-deps
        working-directory: worker
        run: npm ci

      - name: Typecheck
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.worker-deps.outcome == 'success' }}
        # -p tsconfig.app.json, NOT a bare `tsc --noEmit`.
        #
        # The root tsconfig is `files: []` plus project references, and tsc
        # without -p or -b does not follow references — so the bare form
        # typechecks NOTHING and exits 0. Verified by planting a deliberate type
        # error in src/ and watching it pass. This step has never caught
        # anything and could not have; the local pre-push hook has been the only
        # real typecheck. Same shape as the rest of today's findings: a gate
        # that reports success for two different states.
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Edge functions syntax check
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npx esbuild supabase/functions/free-keyword-scan/index.ts supabase/functions/free-keyword-scan/industry-detection.ts supabase/functions/free-keyword-scan/market-intelligence.ts supabase/functions/send-scan-report/index.ts --outdir=/tmp/esbuild-ci
      - name: Tests (includes golden detection corpus)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.worker-deps.outcome == 'success' }}
        run: npx vitest run
      - name: Production build
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run build

      # THE APPLY DRIVER, PAST THE CLICK. Everything above compares selectors
      # and field names against recordings; none of it presses submit, waits for
      # the page to settle, or runs confirmed(). Those lines decide whether a
      # real person's application is recorded as SENT — and a bug there already
      # recorded a FAILED submit as sent, because "thank you for your interest
      # in this role" is ordinary job-ad copy sitting on the form page.
      #
      # Its own deps and its own browser: the worker is a separate package that
      # the root `npm ci` does not install, and Playwright needs a Chromium
      # matching whatever npm actually resolved rather than one baked into an
      # image tag.
      - name: Install Chromium for the harness
        id: chromium
        if: ${{ !cancelled() && steps.worker-deps.outcome == 'success' }}
        working-directory: worker
        run: npx playwright install --with-deps chromium
      - name: Apply-driver harness (six outcomes, past the click)
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        working-directory: worker
        run: npm run harness

  # THE DENO TESTS BESIDE THE EDGE FUNCTIONS. 62 of them, and until 2026-10-10
  # nothing ran them: check-functions.sh only typechecked them and CI never
  # called it. Their own job, so a Deno failure and a vitest failure are two
  # separate red checks rather than one step hiding the other.
  deno-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # NODE AND THE ROOT DEPS, because one Deno test is a node test too.
      # layoff-filings/mirror_test.ts runs scripts/layoff-board-names-mirror.mjs
      # --emit (deno-tests.sh grants --allow-run=node), and that script loads
      # the catalogue reader and the facet map through tsx. With no install
      # here the parity test failed on main with "Cannot find module
      # 'tsx/cjs/api'" (run 38174026636): the check that the deployed mirror
      # and the operator script write the same names never ran in CI. Same
      # node pin and install as the other jobs (the --legacy-peer-deps reason
      # is written above the `test` job's install).
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno tests (supabase/functions/**/*_test.ts)
        run: bash scripts/deno-tests.sh

  # THE GUARDS ON BUILT OUTPUT. Five suites read dist/ (the sitemap, the
  # prerendered posting pages, the skip link, the preload hints) and skip when
  # it is absent; the test job runs vitest before its build, so on every CI run
  # until 2026-10-10 they skipped and the soft-404 sitemap guards never ran
  # anywhere. Here the build comes first and RB_REQUIRE_DIST=1 turns a missing
  # dist/ into a failure instead of a skip (src/test/helpers/built-output.ts).
  #
  # A SEPARATE JOB ON PURPOSE: the prerender bakes LIVE board data, so what
  # these suites judge moves with production between two runs of one commit.
  # They are a finding about the site, not a property of the commit, and stay
  # out of the `test` job that branch protection should require.
  built-output:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Production build (bakes the prerendered pages)
        run: npm run build
      - name: The guards on built output
        env:
          RB_REQUIRE_DIST: "1"
        run: |
          FILES=$(grep -rlE --include='*.test.ts' --include='*.test.tsx' 'skipIf\(skipWithoutDist\(' src/test || true)
          # An empty list would make vitest run the WHOLE suite: refuse instead.
          [ -n "$FILES" ] || { echo "::error::no suite skips through skipWithoutDist"; exit 1; }
          echo "$FILES"
          npx vitest run $FILES
