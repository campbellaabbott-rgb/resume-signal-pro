<svg xmlns="http://www.w3.org/2000/svg" width="160" height="600" viewBox="0 0 160 600" role="img" aria-labelledby="banner-title" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="banner-title">Resume Booster: see how an ATS reads your resume. Free scan: the parse of your file and the keywords you’re missing. Scan my resume free. No sign-up.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1222"/>
      <stop offset="1" stop-color="#172544"/>
    </linearGradient>
  </defs>
  <rect width="160" height="600" fill="url(#bg)"/>
  <g transform="translate(58 40)">
    <path d="M4 0h26l14 14v38a4 4 0 0 1-4 4H4a4 4 0 0 1-4-4V4a4 4 0 0 1 4-4z" fill="#ffffff"/>
    <path d="M30 0v10a4 4 0 0 0 4 4h10z" fill="#c9d8f5"/>
